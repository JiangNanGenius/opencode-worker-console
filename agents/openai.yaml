interface:
  display_name: "OpenCode Worker Pool"
  short_description: "Delegate large code work; keep small fix/test cycles local"
  default_prompt: "Use $delegate-opencode for large implementation packages, cross-module work and systematic codebase investigations; keep local investigation, repeated small fix/test cycles and post-delivery touch-ups with the coordinator or its available native agents, preserving worker ownership until safe takeover; choose a tier only after deciding to delegate, with Normal as the default and profile=auto."
policy:
  allow_implicit_invocation: true
