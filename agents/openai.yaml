interface:
  display_name: "OpenCode Worker Pool"
  short_description: "Delegate larger work; handle targeted fixes directly"
  default_prompt: "Use $delegate-opencode to delegate repository exploration and substantial execution packages early, handle clear local fixes and small corrections to completed worker results directly, and choose a tier only after deciding a handoff is worthwhile, with Normal as the delegated default and profile=auto."
policy:
  allow_implicit_invocation: true
